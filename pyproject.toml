[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ym-robber"
version = "1.1.0"
description = "Скачивание музыки из Яндекс Музыки с метаданными"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "HTnoj", email = "netesovivan2005@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "art>=6.0",
    "yandex-music[async]>=3.0.0",
    "pyperclip>=1.11.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
ym-robber = "ym_robber.main:main"
ym-robber-async = "ym_robber_async.main_async:main"

[tool.setuptools.packages.find]
include = ["*"]